<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizuálny PDF Porovnávač</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .upload-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .upload-box h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .file-input-wrapper input[type=file] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 15px;
            background: #667eea;
            color: white;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .file-input-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .file-name {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-info {
            color: #667eea;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .removed-color { background: rgba(255, 0, 0, 0.3); }
        .added-color { background: rgba(0, 255, 0, 0.3); }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .viewer {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .viewer.show {
            display: block;
        }

        .pdf-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .pdf-panel {
            position: relative;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pdf-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background: white;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 1200px) {
            .pdf-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Vizuálny PDF Porovnávač</h1>

        <div class="upload-section">
            <div class="upload-box">
                <h2>📄 Prvý PDF súbor</h2>
                <div class="file-input-wrapper">
                    <input type="file" id="pdf1" accept=".pdf">
                    <label for="pdf1" class="file-input-label">Vybrať PDF 1</label>
                </div>
                <div class="file-name" id="filename1">Žiadny súbor</div>
            </div>

            <div class="upload-box">
                <h2>📄 Druhý PDF súbor</h2>
                <div class="file-input-wrapper">
                    <input type="file" id="pdf2" accept=".pdf">
                    <label for="pdf2" class="file-input-label">Vybrať PDF 2</label>
                </div>
                <div class="file-name" id="filename2">Žiadny súbor</div>
            </div>
        </div>

        <div class="controls">
            <button id="compareBtn" disabled>🔍 Porovnať PDF</button>
            
            <div class="page-nav" id="pageNav" style="display: none;">
                <button id="prevPage">← Predošlá</button>
                <span class="page-info" id="pageInfo">Strana 1 / 1</span>
                <button id="nextPage">Ďalšia →</button>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color removed-color"></div>
                    <span>Odstránené</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color added-color"></div>
                    <span>Pridané</span>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Spracovávam PDF súbory...
        </div>

        <div class="viewer" id="viewer">
            <div class="stats" id="stats"></div>
            <div class="pdf-container">
                <div class="pdf-panel">
                    <h3 id="pdf1Title">PDF 1</h3>
                    <div class="canvas-wrapper">
                        <canvas id="canvas1"></canvas>
                        <canvas id="overlay1" class="overlay-canvas"></canvas>
                    </div>
                </div>
                <div class="pdf-panel">
                    <h3 id="pdf2Title">PDF 2</h3>
                    <div class="canvas-wrapper">
                        <canvas id="canvas2"></canvas>
                        <canvas id="overlay2" class="overlay-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let file1 = null, file2 = null;
        let pdf1Doc = null, pdf2Doc = null;
        let currentPage = 1;
        let totalPages = 1;
        let allData = {
            removedWords: new Set(),
            addedWords: new Set()
        };

        document.getElementById('pdf1').addEventListener('change', (e) => {
            file1 = e.target.files[0];
            document.getElementById('filename1').textContent = file1 ? file1.name : 'Žiadny súbor';
            checkFiles();
        });

        document.getElementById('pdf2').addEventListener('change', (e) => {
            file2 = e.target.files[0];
            document.getElementById('filename2').textContent = file2 ? file2.name : 'Žiadny súbor';
            checkFiles();
        });

        function checkFiles() {
            document.getElementById('compareBtn').disabled = !(file1 && file2);
        }

        document.getElementById('compareBtn').addEventListener('click', comparePDFs);
        document.getElementById('prevPage').addEventListener('click', () => changePage(-1));
        document.getElementById('nextPage').addEventListener('click', () => changePage(1));

        async function comparePDFs() {
            document.getElementById('loading').classList.add('show');
            document.getElementById('viewer').classList.remove('show');

            try {
                const data1 = await file1.arrayBuffer();
                const data2 = await file2.arrayBuffer();

                pdf1Doc = await pdfjsLib.getDocument(data1).promise;
                pdf2Doc = await pdfjsLib.getDocument(data2).promise;

                totalPages = Math.max(pdf1Doc.numPages, pdf2Doc.numPages);
                
                document.getElementById('pdf1Title').textContent = file1.name;
                document.getElementById('pdf2Title').textContent = file2.name;

                // Získame celý text z oboch PDF
                let allText1 = '';
                let allText2 = '';

                for (let i = 1; i <= pdf1Doc.numPages; i++) {
                    const page = await pdf1Doc.getPage(i);
                    const content = await page.getTextContent();
                    allText1 += ' ' + content.items.map(item => item.str).join(' ');
                }

                for (let i = 1; i <= pdf2Doc.numPages; i++) {
                    const page = await pdf2Doc.getPage(i);
                    const content = await page.getTextContent();
                    allText2 += ' ' + content.items.map(item => item.str).join(' ');
                }

                // Normalizujeme a rozdelíme na slová
                const words1 = new Set(allText1.toLowerCase().split(/\s+/).filter(w => w.length > 0));
                const words2 = new Set(allText2.toLowerCase().split(/\s+/).filter(w => w.length > 0));

                // Nájdeme skutočné rozdiely
                allData.removedWords = new Set([...words1].filter(w => !words2.has(w)));
                allData.addedWords = new Set([...words2].filter(w => !words1.has(w)));

                currentPage = 1;
                await renderCurrentPage();
                updateStats();

                document.getElementById('pageNav').style.display = totalPages > 1 ? 'flex' : 'none';
                document.getElementById('viewer').classList.add('show');
            } catch (error) {
                alert('Chyba: ' + error.message);
                console.error(error);
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }

        async function renderCurrentPage() {
            const page1 = currentPage <= pdf1Doc.numPages ? await pdf1Doc.getPage(currentPage) : null;
            const page2 = currentPage <= pdf2Doc.numPages ? await pdf2Doc.getPage(currentPage) : null;

            let text1Items = [];
            let text2Items = [];

            if (page1) {
                const content1 = await page1.getTextContent();
                text1Items = content1.items.map(item => ({
                    text: item.str.trim(),
                    x: item.transform[4],
                    y: item.transform[5],
                    width: item.width,
                    height: item.height
                }));
            }

            if (page2) {
                const content2 = await page2.getTextContent();
                text2Items = content2.items.map(item => ({
                    text: item.str.trim(),
                    x: item.transform[4],
                    y: item.transform[5],
                    width: item.width,
                    height: item.height
                }));
            }

            await renderPDFPage(page1, 'canvas1', 'overlay1', text1Items, allData.removedWords);
            await renderPDFPage(page2, 'canvas2', 'overlay2', text2Items, allData.addedWords);

            document.getElementById('pageInfo').textContent = `Strana ${currentPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        async function renderPDFPage(page, canvasId, overlayId, textItems, wordsToHighlight) {
            const canvas = document.getElementById(canvasId);
            const overlay = document.getElementById(overlayId);
            const ctx = canvas.getContext('2d');
            const overlayCtx = overlay.getContext('2d');

            if (!page) {
                canvas.width = 600;
                canvas.height = 800;
                overlay.width = 600;
                overlay.height = 800;
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#999';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Strana neexistuje', canvas.width / 2, canvas.height / 2);
                return;
            }

            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            overlay.width = viewport.width;
            overlay.height = viewport.height;

            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;

            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

            const isRemoved = canvasId === 'canvas1';
            overlayCtx.fillStyle = isRemoved ? 'rgba(255, 0, 0, 0.3)' : 'rgba(0, 255, 0, 0.3)';

            textItems.forEach(item => {
                if (!item.text) return;
                const normalizedText = item.text.toLowerCase();
                
                if (wordsToHighlight.has(normalizedText)) {
                    const x = item.x * viewport.scale;
                    const y = viewport.height - (item.y * viewport.scale);
                    const w = item.width * viewport.scale;
                    const h = item.height * viewport.scale;
                    
                    overlayCtx.fillRect(x, y - h, w, h);
                }
            });
        }

        function changePage(delta) {
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderCurrentPage();
        }

        function updateStats() {
            const removed = allData.removedWords.size;
            const added = allData.addedWords.size;

            document.getElementById('stats').innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${totalPages}</div>
                    <div class="stat-label">Celkom strán</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${removed}</div>
                    <div class="stat-label">Unikátne odstránené slová</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${added}</div>
                    <div class="stat-label">Unikátne pridané slová</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${removed + added}</div>
                    <div class="stat-label">Celkovo zmien</div>
                </div>
            `;
        }
    </script>
</body>
</html>
