<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Odstraňovač Metadát z PDF</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        // Material Design 3 Baseline Palette (Purple)
                        m3: {
                            primary: '#6750A4',
                            onPrimary: '#FFFFFF',
                            primaryContainer: '#EADDFF',
                            onPrimaryContainer: '#21005D',

                            secondary: '#625B71',
                            onSecondary: '#FFFFFF',
                            secondaryContainer: '#E8DEF8',
                            onSecondaryContainer: '#1D192B',

                            error: '#B3261E',
                            onError: '#FFFFFF',

                            background: '#FEF7FF',
                            onBackground: '#1D1B20',

                            surface: '#FEF7FF',
                            onSurface: '#1D1B20',

                            surfaceVariant: '#E7E0EC',
                            onSurfaceVariant: '#49454F',

                            outline: '#79747E',

                            // Dark Mode Baseline
                            dark: {
                                primary: '#D0BCFF',
                                onPrimary: '#381E72',
                                primaryContainer: '#4F378B',
                                onPrimaryContainer: '#EADDFF',

                                background: '#141218',
                                surface: '#141218',
                                surfaceContainer: '#211F26', // Elevation 2 equivalent

                                outline: '#938F99',
                                surfaceVariant: '#49454F'
                            }
                        }
                    },
                    borderRadius: {
                        'm3': '28px', // Standard corner radius for containers
                        'm3-sm': '16px',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF Lib -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
        }

        /* Material Ripple effect simulation */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        /* Custom Scrollbar to match M3 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E7E0EC;
            border-radius: 4px;
        }

        @media (prefers-color-scheme: dark) {
            ::-webkit-scrollbar-thumb {
                background: #49454F;
            }
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid currentColor;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body
    class="bg-m3-background text-m3-onBackground dark:bg-m3-dark-background dark:text-[#E6E1E5] h-screen flex flex-col transition-colors duration-200">

    <!-- Top App Bar (Center Aligned) -->
    <nav
        class="h-16 flex items-center justify-center px-4 flex-none sticky top-0 bg-m3-background/95 dark:bg-m3-dark-background/95 backdrop-blur z-20">
        <h1 class="text-[22px] leading-7 font-normal text-m3-onSurface dark:text-[#E6E1E5]">PDF Sanitizer</h1>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center p-4 w-full max-w-screen-md mx-auto overflow-hidden">

        <!-- Card Container -->
        <div
            class="w-full flex-grow flex flex-col bg-[#F3EDF7] dark:bg-m3-dark-surfaceContainer rounded-m3 overflow-hidden transition-colors duration-200">

            <!-- Upload Area (Surface Variant Styled) -->
            <div class="p-4 flex-none">
                <div id="dropZone"
                    class="border border-dashed border-m3-outline dark:border-m3-dark-outline rounded-[24px] h-40 flex flex-col items-center justify-center cursor-pointer hover:bg-m3-onSurface/5 dark:hover:bg-white/5 transition-colors group relative">
                    <input type="file" id="fileInput" multiple accept=".pdf" class="hidden">

                    <div class="flex flex-col items-center gap-2">
                        <i data-lucide="upload" class="w-8 h-8 text-m3-primary dark:text-m3-dark-primary mb-1"></i>
                        <p class="text-sm font-medium text-m3-onSurfaceVariant dark:text-[#CAC4D0]">
                            Vyberte alebo potiahnite PDF súbory
                        </p>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div id="actionBar" class="hidden px-6 py-2 flex items-center justify-between flex-none">
                <span
                    class="text-sm font-medium text-m3-primary dark:text-m3-dark-primary bg-m3-primaryContainer dark:bg-m3-dark-primaryContainer px-3 py-1 rounded-full">
                    Súbory: <span id="fileCount">0</span>
                </span>
                <button id="clearBtn"
                    class="text-sm font-medium text-m3-error dark:text-[#FFB4AB] hover:bg-m3-error/10 px-4 py-2 rounded-full transition-colors">
                    Vymazať všetko
                </button>
            </div>

            <!-- File List -->
            <div class="flex-grow overflow-y-auto px-4 pb-4" id="fileListContainer">
                <div id="emptyState"
                    class="h-full flex flex-col items-center justify-center text-m3-onSurfaceVariant/60 dark:text-[#CAC4D0]/50">
                    <i data-lucide="folder-open" class="w-12 h-12 mb-3 opacity-50"></i>
                    <p class="text-sm">Zoznam je prázdny</p>
                </div>
                <div class="space-y-1" id="fileList">
                    <!-- List Items -->
                </div>
            </div>

            <!-- Bottom Actions -->
            <div
                class="p-6 border-t border-m3-outline/10 dark:border-white/10 flex flex-col sm:flex-row gap-4 items-center justify-between bg-m3-surface dark:bg-m3-dark-surfaceContainer">
                <div class="flex items-center gap-2 text-xs text-m3-onSurfaceVariant dark:text-[#CAC4D0]">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                    <span>Odstráni sa: Autor, Titul, Metadata...</span>
                </div>

                <!-- FAB / Main Button -->
                <button id="processBtn" disabled
                    class="w-full sm:w-auto bg-m3-primary dark:bg-m3-dark-primary text-m3-onPrimary dark:text-m3-dark-onPrimary disabled:bg-m3-onSurface/12 disabled:text-m3-onSurface/38 dark:disabled:bg-white/10 dark:disabled:text-white/30 h-10 px-6 rounded-full font-medium text-sm tracking-wide shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span>Vyčistiť</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Dialog (Modal) -->
    <div id="successModal"
        class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 transition-opacity opacity-0"
        style="transition: opacity 0.2s ease-in-out;">
        <div class="bg-m3-surface dark:bg-[#2B2930] rounded-[28px] max-w-[312px] w-full p-6 shadow-xl flex flex-col items-center text-center transform scale-95 transition-transform"
            id="modalContent">

            <i data-lucide="check-circle-2" class="w-10 h-10 text-m3-primary dark:text-m3-dark-primary mb-4"></i>

            <h2 class="text-2xl font-normal text-m3-onSurface dark:text-[#E6E1E5] mb-2">Hotovo</h2>
            <p class="text-sm text-m3-onSurfaceVariant dark:text-[#C4C7C5] mb-6">
                Súbory boli úspešne spracované.
            </p>

            <button id="downloadBtn"
                class="w-full text-m3-primary dark:text-m3-dark-primary hover:bg-m3-primary/10 dark:hover:bg-m3-dark-primary/10 h-10 rounded-full font-medium text-sm transition-colors mb-2">
                Stiahnuť súbory
            </button>

            <button onclick="resetApp()"
                class="w-full text-m3-onSurfaceVariant dark:text-[#C4C7C5] hover:bg-m3-onSurface/10 h-10 rounded-full font-medium text-sm transition-colors">
                Zavrieť
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Constants & State
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const emptyState = document.getElementById('emptyState');
        const fileCountSpan = document.getElementById('fileCount');
        const processBtn = document.getElementById('processBtn');
        const clearBtn = document.getElementById('clearBtn');
        const actionBar = document.getElementById('actionBar');
        const successModal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');
        const downloadBtn = document.getElementById('downloadBtn');

        let filesQueue = [];
        let processedBlob = null;
        let isZip = false;

        // --- Event Listeners ---
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-m3-primaryContainer/30');
            dropZone.classList.add('dark:bg-m3-dark-primaryContainer/30');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-m3-primaryContainer/30');
            dropZone.classList.remove('dark:bg-m3-dark-primaryContainer/30');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-m3-primaryContainer/30');
            dropZone.classList.remove('dark:bg-m3-dark-primaryContainer/30');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = '';
        });

        clearBtn.addEventListener('click', () => {
            filesQueue = [];
            renderFiles();
        });

        processBtn.addEventListener('click', sanitizeFiles);

        // --- Core Functions ---

        function handleFiles(newFiles) {
            const validFiles = Array.from(newFiles).filter(file => file.type === 'application/pdf');
            if (validFiles.length === 0 && newFiles.length > 0) {
                alert('Iba PDF súbory sú podporované.');
                return;
            }
            validFiles.forEach(file => {
                filesQueue.push({
                    file: file,
                    id: Math.random().toString(36).substr(2, 9),
                    status: 'pending'
                });
            });
            renderFiles();
        }

        function renderFiles() {
            fileList.innerHTML = '';
            fileCountSpan.textContent = filesQueue.length;

            if (filesQueue.length === 0) {
                emptyState.classList.remove('hidden');
                actionBar.classList.add('hidden');
                processBtn.disabled = true;
                processBtn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span>Vyčistiť</span>`;
                lucide.createIcons();
                return;
            }

            emptyState.classList.add('hidden');
            actionBar.classList.remove('hidden');
            processBtn.disabled = false;

            filesQueue.forEach((item) => {
                const div = document.createElement('div');
                // M3 List Item Style
                div.className = 'flex items-center justify-between p-3 rounded-xl hover:bg-m3-onSurface/5 dark:hover:bg-white/5 transition-colors group';

                let statusIcon = '';

                if (item.status === 'pending') {
                    statusIcon = `<button onclick="removeFile('${item.id}')" class="text-m3-onSurfaceVariant dark:text-[#CAC4D0] hover:text-m3-error dark:hover:text-[#FFB4AB] p-2 rounded-full hover:bg-m3-onSurface/10"><i data-lucide="x" class="w-5 h-5"></i></button>`;
                } else if (item.status === 'processing') {
                    statusIcon = `<div class="loader text-m3-primary dark:text-m3-dark-primary"></div>`;
                } else if (item.status === 'done') {
                    statusIcon = `<i data-lucide="check" class="w-5 h-5 text-green-600 dark:text-green-300"></i>`;
                } else if (item.status === 'error') {
                    statusIcon = `<i data-lucide="alert-circle" class="w-5 h-5 text-m3-error dark:text-[#FFB4AB]"></i>`;
                }

                div.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-m3-primaryContainer dark:bg-m3-dark-primaryContainer text-m3-onPrimaryContainer dark:text-m3-dark-onPrimaryContainer flex items-center justify-center flex-shrink-0">
                            <i data-lucide="file" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex flex-col">
                            <span class="text-base text-m3-onSurface dark:text-[#E6E1E5] truncate" title="${item.file.name}">${item.file.name}</span>
                            <span class="text-xs text-m3-onSurfaceVariant dark:text-[#CAC4D0]">${(item.file.size / 1024 / 1024).toFixed(2)} MB</span>
                        </div>
                    </div>
                    <div class="flex-shrink-0 ml-2">
                        ${statusIcon}
                    </div>
                `;
                fileList.appendChild(div);
            });
            lucide.createIcons();
        }

        function removeFile(id) {
            filesQueue = filesQueue.filter(f => f.id !== id);
            renderFiles();
        }

        async function sanitizeFiles() {
            processBtn.disabled = true;
            processBtn.innerHTML = `<div class="loader w-4 h-4 mr-2"></div><span>Pracujem</span>`;

            const { PDFDocument } = PDFLib;
            const zip = new JSZip();
            let successCount = 0;

            for (let i = 0; i < filesQueue.length; i++) {
                const item = filesQueue[i];
                item.status = 'processing';
                renderFiles();

                try {
                    const arrayBuffer = await item.file.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });

                    // Sanitize
                    pdfDoc.setTitle('');
                    pdfDoc.setAuthor('');
                    pdfDoc.setSubject('');
                    pdfDoc.setKeywords([]);
                    pdfDoc.setProducer('');
                    pdfDoc.setCreator('');
                    pdfDoc.setModificationDate(new Date());

                    const pdfBytes = await pdfDoc.save();
                    const cleanName = "clean_" + item.file.name;

                    if (filesQueue.length > 1) {
                        zip.file(cleanName, pdfBytes);
                    } else {
                        processedBlob = new Blob([pdfBytes], { type: "application/pdf" });
                        processedBlob.name = cleanName;
                    }

                    item.status = 'done';
                    successCount++;
                } catch (error) {
                    console.error("Chyba:", error);
                    item.status = 'error';
                }
                await new Promise(r => setTimeout(r, 100));
            }

            renderFiles();

            if (successCount > 0) {
                if (filesQueue.length > 1) {
                    isZip = true;
                    processedBlob = await zip.generateAsync({ type: "blob" });
                } else {
                    isZip = false;
                }
                showSuccessModal();
            }

            processBtn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span>Vyčistiť</span>`;
        }

        function showSuccessModal() {
            successModal.classList.remove('hidden');
            successModal.classList.add('flex');
            // Trigger animation
            setTimeout(() => {
                successModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);

            downloadBtn.onclick = () => {
                const url = URL.createObjectURL(processedBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = isZip ? "vycistene_dokumenty.zip" : processedBlob.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        }

        function resetApp() {
            successModal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            modalContent.classList.remove('scale-100');

            setTimeout(() => {
                successModal.classList.add('hidden');
                successModal.classList.remove('flex');
            }, 200);

            filesQueue = [];
            renderFiles();
        }
    </script>
</body>

</html>
