<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF porovnávanie</title>
    
    <!-- Favicon: Blue-600 background, White stroke, Vertical split icon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Crect width='24' height='24' rx='4' fill='%232563eb'/%3E%3Cpath d='M9 4H5C3.89543 4 3 4.89543 3 6V18C3 19.1046 3.89543 20 5 20H9M15 4H19C20.1046 4 21 4.89543 21 6V18C21 19.1046 20.1046 20 19 20H15M12 4V20' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- JSDiff -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
    <!-- Marked pre Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        tailwind.config = {
            darkMode: 'class', // Zmenené na 'class' pre manuálne prepínanie
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#ef4444',
                        success: '#22c55e',
                        ai: '#8b5cf6'
                    }
                }
            }
        }

        // Inicializácia témy pred načítaním body, aby to nebliklo
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .no-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .no-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .dark .no-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
        }

        .no-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .pdf-page-container {
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            background-color: white;
        }

        canvas {
            display: block;
        }

        #results-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        .connection-line {
            fill: none;
            stroke: #64748b;
            stroke-width: 1.5;
            stroke-opacity: 0.5;
        }

        @media (prefers-color-scheme: dark) {
            .connection-line {
                stroke: #a0aec0;
                stroke-opacity: 0.5;
            }
        }

        .scroll-col {
            height: 100%;
            overflow-y: auto;
            position: relative;
            scroll-behavior: auto;
        }

        /* Toggle Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #8b5cf6;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #8b5cf6;
        }

        /* Markdown Styles */
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markdown-body p {
            margin-bottom: 0.75rem;
        }

        /* Progress Bar Animation */
        @keyframes progress-indeterminate {
            0% {
                left: -100%;
                width: 50%;
            }

            50% {
                left: 25%;
                width: 75%;
            }

            100% {
                left: 100%;
                width: 50%;
            }
        }

        .animate-progress {
            position: relative;
            overflow: hidden;
        }

        .animate-progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            width: 100%;
            animation: progress-indeterminate 1.5s infinite linear;
        }

        /* Transition pre progress bar */
        #progress-bar {
            transition: width 0.3s ease-out;
        }
    </style>
</head>

    <script>
        // --- State ---
        let apiKey = localStorage.getItem('gemini_api_key') || "";
        const scale = 1.3;

        let file1 = null, file2 = null;
        let doc1 = null, doc2 = null;

        let rawWords1 = [], rawWords2 = [];
        let rawText1 = "", rawText2 = "";
        let aiText1 = "", aiText2 = "";

        let isAiOptimized = false;
        let syncEnabled = true;
        let smartAlignEnabled = false;
        let cachedDiff = null;
        let matchPairs = []; // {y1, y2} for alignment

        // Progress Steps (Refined)
        const steps = {
            loading: 10,
            extracting: 30,
            rendering: 60,
            ai: 75,
            diffing: 90,
            drawing: 95,
            finished: 100
        };

        // --- Elements ---
        const input1 = document.getElementById('pdf1-upload');
        const input2 = document.getElementById('pdf2-upload');
        const compareBtn = document.getElementById('compare-btn');
        const loader = document.getElementById('loader');

        const controlsHeader = document.getElementById('controls-header');

        const scrollLeft = document.getElementById('scroll-left');
        const scrollRight = document.getElementById('scroll-right');
        const colLeftContent = document.getElementById('col-left-content');
        const colRightContent = document.getElementById('col-right-content');
        const connectionsLayer = document.getElementById('connections-layer');
        const syncCheck = document.getElementById('sync-scroll-check');
        const smartAlignCheck = document.getElementById('smart-align-check');
        const apiKeyInput = document.getElementById('api-key-input');

        // Toggles
        const mainAiCheck = document.getElementById('ai-optimize-check');
        const mainAiBg = document.getElementById('ai-toggle-bg');
        const mainAiDot = document.getElementById('ai-toggle-dot');
        const headerAiToggle = document.getElementById('header-ai-toggle');
        const headerAiBg = document.getElementById('header-ai-bg');
        const headerAiDot = document.getElementById('header-ai-dot');
        const headerAiText = document.getElementById('header-ai-text');

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        // AI Modal
        const aiModal = document.getElementById('ai-modal');
        const modalOverlay = document.getElementById('modal-overlay');
        const openAiBtn = document.getElementById('open-ai-btn');
        const closeAiBtn = document.getElementById('close-ai-btn');
        const generateAiBtn = document.getElementById('generate-ai-btn');
        const aiContent = document.getElementById('ai-content');

        // --- Init ---
        if (apiKey) apiKeyInput.value = apiKey;

        // Theme Icons Init
        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        function updateProgress(percent, text) {
            progressBar.style.width = `${percent}%`;
            if (text) loaderText.textContent = text;
        }

        // --- Toggle UI Logic ---
        function updateToggleUI(checked) {
            mainAiCheck.checked = checked;
            if (checked) {
                mainAiBg.classList.replace('bg-gray-200', 'bg-purple-500');
                mainAiBg.classList.replace('dark:bg-gray-600', 'bg-purple-500');

        async function runInitialComparison() {
            errorMsg.classList.add('hidden');
            compareBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            try {
                updateProgress(steps.loading, "Načítavam PDF súbory...");
                const ab1 = await file1.arrayBuffer();
                const ab2 = await file2.arrayBuffer();
                doc1 = await pdfjsLib.getDocument({ data: ab1 }).promise;
                doc2 = await pdfjsLib.getDocument({ data: ab2 }).promise;

                updateProgress(steps.extracting, "Extrahujem text...");
                rawWords1 = await getAllWordsFromDoc(doc1);
                rawWords2 = await getAllWordsFromDoc(doc2);

                rawText1 = reconstructTextForAI(rawWords1);
                rawText2 = reconstructTextForAI(rawWords2);

                updateProgress(steps.rendering, "Vykresľujem pozadie...");
                colLeftContent.innerHTML = '';
                colRightContent.innerHTML = '';
                await renderAllPages(doc1, colLeftContent, "left");
                await renderAllPages(doc2, colRightContent, "right");

                await performDiffAndRender();

                // Finish
                updateProgress(steps.finished, "Hotovo!");
                setTimeout(() => {
                    loader.classList.add('hidden');
                    uploadSection.classList.add('hidden');
                    resultsArea.classList.remove('hidden');
                    controlsHeader.classList.remove('hidden');
                    controlsHeader.classList.add('flex');
                    backBtn.classList.remove('hidden');
                    backBtn.classList.add('flex');
                }, 300);

            } catch (err) {
                console.error(err);
                showError(err.message);
                loader.classList.add('hidden');
                compareBtn.classList.remove('hidden');
            }
        }

        async function performDiffAndRender() {
            if (isAiOptimized && (!aiText1 || !aiText2)) {
                const isResultsVisible = !resultsArea.classList.contains('hidden');
                let floatLoader;

                if (isResultsVisible) {
                    floatLoader = document.createElement('div');
                    floatLoader.className = "fixed inset-0 bg-white/50 z-50 flex items-center justify-center backdrop-blur-sm";
                    floatLoader.innerHTML = `<div class="bg-white p-6 rounded-lg shadow-xl flex flex-col items-center gap-4"><div class="w-64 h-2 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-purple-600 animate-progress"></div></div><span class="font-medium text-gray-700">AI Optimalizuje text...</span></div>`;
                    document.body.appendChild(floatLoader);
                } else {
                    updateProgress(steps.ai, "AI optimalizuje text...");
                }

                try {
                    const [opt1, opt2] = await Promise.all([
                        optimizeTextWithAI(rawText1),
                        optimizeTextWithAI(rawText2)
                    ]);
                    aiText1 = opt1;
                    aiText2 = opt2;
                } catch (e) {
                    alert("AI Error: " + e.message);
                    isAiOptimized = false;
                    updateToggleUI(false);
                } finally {
                    if (floatLoader) floatLoader.remove();
                }
            } else if (!isResultsVisible()) {
                updateProgress(steps.diffing, "Počítam rozdiely...");
            }

            const sourceText1 = isAiOptimized ? aiText1 : rawText1;
            const sourceText2 = isAiOptimized ? aiText2 : rawText2;

            const arr1 = sourceText1.split(/\s+/).filter(s => s.length > 0);
            const arr2 = sourceText2.split(/\s+/).filter(s => s.length > 0);

            const diff = Diff.diffArrays(arr1, arr2);

            if (!isResultsVisible()) updateProgress(steps.drawing, "Zvýrazňujem zmeny...");
            await refreshCanvases();
            highlightDiffs(diff, rawWords1, rawWords2);
            cachedDiff = diff;
            calculateMatchPairsFromDiffV2(diff);
            setTimeout(() => drawConnections(diff), 100);
        }

        function isResultsVisible() {
            return !resultsArea.classList.contains('hidden');
        }

        async function refreshCanvases() {
            const p1 = redrawDoc(doc1, 'left');
            const p2 = redrawDoc(doc2, 'right');
            await Promise.all([p1, p2]);
        }

        async function redrawDoc(doc, side) {
            for (let i = 1; i <= doc.numPages; i++) {
                const canvas = document.getElementById(`${side}-page-${i}`);
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.globalCompositeOperation = 'source-over';
                    const page = await doc.getPage(i);
                    const viewport = page.getViewport({ scale: scale });
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                }
            }
        }

        function highlightDiffs(diff, words1, words2) {
            let cursor1 = 0;
            let cursor2 = 0;

            const getCtx = (side, page) => {
                const c = document.getElementById(`${side}-page-${page}`);
                return c ? c.getContext('2d') : null;
            };

            diff.forEach(part => {
                const diffWords = part.value;
                part.matchedWords1 = [];
                part.matchedWords2 = [];

                if (part.added) {
                    for (let i = 0; i < diffWords.length; i++) {
                        const target = diffWords[i];
                        let found = false;
                        const LIMIT = 2000;
                        let lookahead = 0;

                        while (cursor2 + lookahead < words2.length && lookahead < LIMIT) {
                            const w = words2[cursor2 + lookahead];
                            if (isMatch(w.text, target)) {
                                cursor2 += lookahead;
                                const ctx = getCtx('right', w.page);
                                if (ctx) {
                                    ctx.globalCompositeOperation = 'multiply';
                                    ctx.fillStyle = 'rgba(34, 197, 94, 0.5)';
                                    ctx.fillRect(w.x - 1, w.y - 1, w.w + 2, w.h + 2);
                                    ctx.globalCompositeOperation = 'source-over';
                                }
                                part.matchedWords2.push(w);
                                cursor2++;
                                found = true;
                                break;
                            }
                            lookahead++;
                        }
                        if (!found && !isAiOptimized) cursor2++;
                    }
                } else if (part.removed) {
                    for (let i = 0; i < diffWords.length; i++) {
                        const target = diffWords[i];
                        let found = false;
                        const LIMIT = 2000;
                        let lookahead = 0;

                        while (cursor1 + lookahead < words1.length && lookahead < LIMIT) {
                            const w = words1[cursor1 + lookahead];
                            if (isMatch(w.text, target)) {
                                cursor1 += lookahead;
                                const ctx = getCtx('left', w.page);
                                if (ctx) {
                                    ctx.globalCompositeOperation = 'multiply';
                                    ctx.fillStyle = 'rgba(239, 68, 68, 0.5)';
                                    ctx.fillRect(w.x - 1, w.y - 1, w.w + 2, w.h + 2);
                                    ctx.globalCompositeOperation = 'source-over';
                                }
                                part.matchedWords1.push(w);
                                cursor1++;
                                found = true;
                                break;
                            }
                            lookahead++;
                        }
                        if (!found && !isAiOptimized) cursor1++;
                    }
                } else {
                    for (let i = 0; i < diffWords.length; i++) {
                        const target = diffWords[i];
                        let l1 = 0;
                        while (cursor1 + l1 < words1.length && l1 < 2000) {
                            if (isMatch(words1[cursor1 + l1].text, target)) { cursor1 += l1 + 1; break; }
                            l1++;
                            if (!isAiOptimized) { cursor1++; break; }
                        }
                        let l2 = 0;
                        while (cursor2 + l2 < words2.length && l2 < 2000) {
                            if (isMatch(words2[cursor2 + l2].text, target)) { cursor2 += l2 + 1; break; }
                            l2++;
                            if (!isAiOptimized) { cursor2++; break; }
                        }
                    }
                }
            });
        }

        function isMatch(a, b) {
            return a.replace(/[^a-zA-Z0-9]/g, "").toLowerCase() ===
                b.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
        }

        function drawConnections(diff) {
            const wrapper = document.getElementById('results-wrapper');
            connectionsLayer.setAttribute('width', wrapper.scrollWidth);
            connectionsLayer.setAttribute('height', wrapper.scrollHeight);
            connectionsLayer.style.width = wrapper.scrollWidth + 'px';
            connectionsLayer.style.height = wrapper.scrollHeight + 'px';
            connectionsLayer.innerHTML = '';

            diff.forEach((part, i) => {
                if (part.removed) {
                    if (i + 1 < diff.length && diff[i + 1].added) {
                        const nextPart = diff[i + 1];
                        const words1 = part.matchedWords1;
                        const words2 = nextPart.matchedWords2;

                        if (words1 && words1.length > 0 && words2 && words2.length > 0) {
                            const start = getVisualCenter(words1, 'left');
                            const end = getVisualCenter(words2, 'right');

                            if (start && end) {
                                if (Math.abs(start.y - end.y) < 2000) {
                                    drawLine(start.x, start.y, end.x, end.y);
                                }
                            }
                        }
                    }
                }
            });
        }

        function getVisualCenter(words, side) {
            if (!words.length) return null;
            const w = words[0];
            const canvas = document.getElementById(`${side}-page-${w.page}`);
            if (!canvas) return null;

            const wrapperRect = document.getElementById('results-wrapper').getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();

            if (canvasRect.bottom < wrapperRect.top || canvasRect.top > wrapperRect.bottom) return null;

            const scaleX = canvasRect.width / canvas.width;
            const scaleY = canvasRect.height / canvas.height;

            return {
                x: (canvasRect.left - wrapperRect.left) + (w.x * scaleX) + (w.w * scaleX / 2),
                y: (canvasRect.top - wrapperRect.top) + (w.y * scaleY) + (w.h * scaleY / 2)
            };
        }

        function drawLine(x1, y1, x2, y2) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.classList.add("connection-line");
            connectionsLayer.appendChild(line);
        }

        function onScrollRedraw() {
            if (cachedDiff) {
                if (window.redrawRequest) cancelAnimationFrame(window.redrawRequest);
                window.redrawRequest = requestAnimationFrame(() => drawConnections(cachedDiff));
            }
        }

        // --- Sync Scroll Fix ---
        let isScrollingLeft = false;
        let isScrollingRight = false;

        function getTargetScroll(currentScroll, sourcePairs, isLeftSource) {
            if (!smartAlignEnabled || matchPairs.length === 0) {
                // Classic percent-based
                const src = isLeftSource ? scrollLeft : scrollRight;
                const tgt = isLeftSource ? scrollRight : scrollLeft;
                const p = src.scrollTop / (src.scrollHeight - src.clientHeight);
                return p * (tgt.scrollHeight - tgt.clientHeight);
            }

            // Smart Align Logic
            // Find pair closest to center of current view
            const viewportH = scrollLeft.clientHeight;
            const center = currentScroll + (viewportH / 2);

            let bestPair = null;
            let minDist = Infinity;

            for (const pair of matchPairs) {
                const y = isLeftSource ? pair.y1 : pair.y2;
                const dist = Math.abs(y - center);
                if (dist < minDist) {
                    minDist = dist;
                    bestPair = pair;
                }
            }

            if (bestPair) {
                const yTarget = isLeftSource ? bestPair.y2 : bestPair.y1;
                return yTarget - (viewportH / 2);
            }

            return currentScroll; // Fallback
        }

        scrollLeft.addEventListener('scroll', () => {
            if (!syncEnabled) { onScrollRedraw(); return; }
            if (isScrollingRight) return;

            isScrollingLeft = true;
            const targetY = getTargetScroll(scrollLeft.scrollTop, matchPairs, true);

            if (Math.abs(scrollRight.scrollTop - targetY) > 5) {
                scrollRight.scrollTop = targetY;
            }
            setTimeout(() => isScrollingLeft = false, 50);
            onScrollRedraw();
        });

        scrollRight.addEventListener('scroll', () => {
            if (!syncEnabled) { onScrollRedraw(); return; }
            if (isScrollingLeft) return;

            isScrollingRight = true;
            const targetY = getTargetScroll(scrollRight.scrollTop, matchPairs, false);

            if (Math.abs(scrollLeft.scrollTop - targetY) > 5) {
                scrollLeft.scrollTop = targetY;
            }
            setTimeout(() => isScrollingRight = false, 50);
            onScrollRedraw();
        });

        function calculateMatchPairsFromDiff(diff) {
            if (!diff) return;
            matchPairs = [];

            // Re-use logic from drawConnections to find valid pairs
            diff.forEach((part, i) => {
                if (part.removed) {
                    if (i + 1 < diff.length && diff[i + 1].added) {
                        const nextPart = diff[i + 1];
                        const words1 = part.matchedWords1;
                        const words2 = nextPart.matchedWords2;

                        if (words1 && words1.length > 0 && words2 && words2.length > 0) {
                            const start = getVisualCenter(words1, 'left');
                            const end = getVisualCenter(words2, 'right');

                            if (start && end) {
                                // start.y is relative to wrapper top. If we add scrollTop, we get absolute Y in the scrollable area.
                                const absY1 = start.y + scrollLeft.scrollTop;
                                const absY2 = end.y + scrollRight.scrollTop;
                                matchPairs.push({ y1: absY1, y2: absY2 });
                            }
                        }
                    }
                }
            });
        }

        function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); }
        async function optimizeTextWithAI(txt) {
            const prompt = `Vyčisti text od šumu (hlavičky, päty) pre diff. Zachovaj obsah:\n${txt.substring(0, 12000)}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const d = await res.json();
            return d.candidates[0].content.parts[0].text;
        }

        async function getAISummary(txt1, txt2) {
            const prompt = `Porovnaj tieto dva texty a vypíš kľúčové rozdiely. Zameraj sa na zmeny vo význame, číslach a dátumoch. Ignoruj formátovanie.\n\nTEXT 1:\n${txt1.substring(0, 10000)}\n\nTEXT 2:\n${txt2.substring(0, 10000)}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const d = await res.json();
            if (d.error) throw new Error(d.error.message);
            return d.candidates[0].content.parts[0].text;
        }
        function reconstructTextForAI(words) {
            if (!words.length) return "";
            let t = "", ly = words[0].y;
            words.forEach(w => {
                t += (Math.abs(w.y - ly) > 10 ? "\n" : " ") + w.text; ly = w.y;
            });
            return t;
        }
        async function getAllWordsFromDoc(doc) {
            let all = [];
            for (let i = 1; i <= doc.numPages; i++) {
                const p = await doc.getPage(i);
                const t = await p.getTextContent();
                const v = p.getViewport({ scale });
                t.items.sort((a, b) => {
                    const dy = b.transform[5] - a.transform[5];
                    return Math.abs(dy) > 5 ? dy : a.transform[4] - b.transform[4];
                });
                t.items.forEach(item => {
                    if (!item.str.trim()) return;
                    const tx = item.transform;
                    const r = v.convertToViewportRectangle([tx[4], tx[5], tx[4] + item.width, tx[5] + (item.height || Math.abs(tx[3]))]);
                    const parts = item.str.split(/\s+/).filter(s => s.length);
                    let cx = Math.min(r[0], r[2]);
                    const cw = Math.abs(r[2] - r[0]) / item.str.length;
                    parts.forEach(part => {
                        all.push({
                            text: part, page: i,
                            x: cx, y: Math.min(r[1], r[3]), w: part.length * cw, h: Math.abs(r[3] - r[1])
                        });
                        cx += (part.length + 1) * cw;
                    });
                });
            }
            return all;
        }
        async function renderAllPages(doc, cont, prefix) {
            for (let i = 1; i <= doc.numPages; i++) {
                const div = document.createElement('div'); div.className = 'pdf-page-container'; cont.appendChild(div);
                const c = document.createElement('canvas'); c.id = `${prefix}-page-${i}`; div.appendChild(c);
                const p = await doc.getPage(i);
                const v = p.getViewport({ scale });
                c.width = v.width; c.height = v.height; c.style.width = '100%';
                await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
            }
        }
    </script>
    <script>
        function calculateMatchPairsFromDiffV2(diff) {
            if (!diff) return;
            matchPairs = [];

            diff.forEach((part, i) => {
                if (part.removed) {
                    if (i + 1 < diff.length && diff[i + 1].added) {
                        const words1 = part.matchedWords1;
                        const words2 = diff[i + 1].matchedWords2;

                        if (words1 && words1.length > 0 && words2 && words2.length > 0) {
                            const w1 = words1[0];
                            const w2 = words2[0];

                            const canvas1 = document.getElementById(`left-page-${w1.page}`);
                            const canvas2 = document.getElementById(`right-page-${w2.page}`);

                            if (canvas1 && canvas2) {
                                const pageBox1 = canvas1.parentElement;
                                const pageBox2 = canvas2.parentElement;

                                const ratio1 = pageBox1.clientWidth / canvas1.width;
                                const ratio2 = pageBox2.clientWidth / canvas2.width;

                                const absY1 = pageBox1.offsetTop + (w1.y * ratio1);
                                const absY2 = pageBox2.offsetTop + (w2.y * ratio2);

                                matchPairs.push({ y1: absY1, y2: absY2 });
                            }
                        }
                    }
                }
            });
        }
    </script>
