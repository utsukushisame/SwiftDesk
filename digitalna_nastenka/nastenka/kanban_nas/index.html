<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS Kanban Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: { 750: '#2d3748', 850: '#1a202c', 950: '#0d1117' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .card-drag {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .card-ghost {
            border: 2px dashed #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .locked-border {
            border: 2px solid #ef4444;
            opacity: 0.75;
            cursor: not-allowed;
            position: relative;
        }

        .locked-border::after {
            content: '🔒';
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-6 shadow-lg z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                NAS Kanban</h1>
            <span id="status-indicator" class="flex h-3 w-3 relative">
                <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span id="status-text" class="text-xs text-gray-500 font-mono pl-1">Connecting...</span>
        </div>
        <div>
            <button onclick="app.createNewCard('todo')"
                class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-lg hover:shadow-blue-500/20 active:scale-95 flex items-center gap-2">
                <span>+</span> Nová karta
            </button>
        </div>
    </header>

    <!-- Board -->
    <main class="flex-1 flex overflow-x-auto p-6 gap-6" id="board-container">
        <!-- Columns will be injected here -->
    </main>

    <!-- Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div
            class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl w-full max-w-lg transform transition-all p-6">
            <h2 class="text-lg font-bold mb-4 text-white">Upraviť kartu</h2>
            <input type="hidden" id="modal-card-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Názov</label>
                    <input type="text" id="modal-title"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-colors"
                        placeholder="Zadajte názov...">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Popis</label>
                    <textarea id="modal-desc" rows="4"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-colors"
                        placeholder="Popis karty..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Farba</label>
                    <div class="flex gap-2" id="modal-color-picker">
                        <!-- Colors injected via JS -->
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-gray-700">
                <button onclick="app.closeModal()"
                    class="px-4 py-2 text-gray-400 hover:text-white transition-colors">Zrušiť</button>
                <button onclick="app.deleteCard()"
                    class="px-4 py-2 text-red-400 hover:text-red-300 transition-colors mr-auto">Odstrániť</button>
                <button onclick="app.saveCard()"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-medium shadow-lg hover:shadow-emerald-500/20 active:scale-95 transition-all">Uložiť</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        class KanbanApp {
            constructor() {
                this.uuid = this.getOrInitUUID();
                this.state = {
                    version: 0,
                    columns: { todo: { title: 'To Do', cards: [] }, progress: { title: 'In Progress', cards: [] }, done: { title: 'Done', cards: [] } },
                    locks: {}
                };
                this.lastEtag = null;
                this.pollingInterval = null;
                this.isEditing = false;
                this.heartbeatInterval = null;
                this.hasUnsavedChanges = false;

                this.colors = [
                    { name: 'gray', bg: 'bg-gray-700' },
                    { name: 'blue', bg: 'bg-blue-900/50 border-blue-800' },
                    { name: 'green', bg: 'bg-emerald-900/50 border-emerald-800' },
                    { name: 'yellow', bg: 'bg-yellow-900/50 border-yellow-800' },
                    { name: 'red', bg: 'bg-red-900/50 border-red-800' }
                ];

                this.init();
            }

            getOrInitUUID() {
                let uuid = localStorage.getItem('kanban_client_uuid');
                if (!uuid) {
                    uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                    localStorage.setItem('kanban_client_uuid', uuid);
                }
                return uuid;
            }

            async init() {
                this.renderBoard();
                this.poll();
                this.pollingInterval = setInterval(() => this.poll(), 2000);

                // Visibility API to pause polling
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        clearInterval(this.pollingInterval);
                        this.updateStatus('paused', 'Polling paused');
                    } else {
                        this.poll();
                        this.pollingInterval = setInterval(() => this.poll(), 2000);
                    }
                });
            }

            async poll() {
                if (this.isEditing && !this.hasUnsavedChanges) {
                    // Ak editujem, stále chceme poll, aby sme videli zámky iných? 
                    // Áno, ale nechceme prepisovať UI ak máme otvorený modal. 
                    // Toto riešime v render.
                }

                try {
                    const headers = {};
                    if (this.lastEtag) headers['If-None-Match'] = this.lastEtag;

                    const res = await fetch('api.php?action=load', { headers });

                    if (res.status === 304) {
                        this.updateStatus('online', 'Synced (No changes)');
                        return;
                    }

                    if (res.status === 200) {
                        const data = await res.json();
                        this.lastEtag = res.headers.get('ETag');

                        // Merge state
                        this.state = data;
                        this.renderBoard();
                        this.updateStatus('online', 'Synced');
                    }
                } catch (e) {
                    console.error('Poll error:', e);
                    this.updateStatus('offline', 'Connection lost');
                }
            }

            renderBoard() {
                if (this.isEditing) return; // Neprekresľovať board počas editácie (modal)

                const container = document.getElementById('board-container');
                container.innerHTML = '';

                Object.keys(this.state.columns).forEach(colId => {
                    const col = this.state.columns[colId];

                    const colEl = document.createElement('div');
                    colEl.className = 'flex-shrink-0 w-80 bg-gray-900 rounded-xl border border-gray-800 flex flex-col h-full max-h-full';
                    colEl.innerHTML = `
                        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-850 rounded-t-xl">
                            <h2 class="font-bold text-gray-100 flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full ${colId === 'todo' ? 'bg-gray-500' : (colId === 'progress' ? 'bg-blue-500' : 'bg-emerald-500')}"></span>
                                ${col.title}
                            </h2>
                            <span class="text-xs font-mono text-gray-500 bg-gray-800 px-2 py-1 rounded">${col.cards.length}</span>
                        </div>
                        <div class="p-3 flex-1 overflow-y-auto space-y-3 min-h-[100px] scroll-smooth" 
                             data-col="${colId}" 
                             ondragover="app.handleDragOver(event)" 
                             ondragleave="app.handleDragLeave(event)"
                             ondrop="app.handleDrop(event)">
                        </div>
                    `;

                    const cardsContainer = colEl.querySelector('[data-col]');

                    col.cards.forEach(card => {
                        const isLocked = this.isCardLocked(card.id);
                        const lockUser = isLocked ? this.state.locks[card.id].user : null;
                        const myLock = lockUser === this.uuid;

                        const cardEl = document.createElement('div');
                        cardEl.draggable = !isLocked || myLock; // Locked cards cannot be dragged
                        cardEl.className = `
                            group relative p-4 rounded-lg border shadow-sm transition-all duration-200 
                            ${card.color ? this.getColorClass(card.color) : 'bg-gray-800 border-gray-700 hover:border-gray-600'}
                            ${isLocked && !myLock ? 'locked-border opacity-60' : 'cursor-grab active:cursor-grabbing hover:translate-y-[-2px] hover:shadow-md'}
                        `;
                        cardEl.dataset.id = card.id;
                        cardEl.dataset.col = colId;

                        // Drag handlers
                        if (!isLocked || myLock) {
                            cardEl.ondragstart = (e) => this.handleDragStart(e, card.id, colId);
                        } else {
                            cardEl.title = "Karta je zamknutá iným používateľom";
                        }

                        // Click to edit
                        cardEl.onclick = (e) => {
                            if (!isLocked || myLock) this.openModal(card, colId);
                        };

                        cardEl.innerHTML = `
                            <h3 class="font-medium text-gray-200 text-sm mb-1 group-hover:text-white">${card.title}</h3>
                            <p class="text-xs text-gray-400 line-clamp-2">${card.description || ''}</p>
                            ${isLocked && !myLock ? '<div class="absolute inset-0 bg-transparent z-10 cursor-not-allowed"></div>' : ''}
                        `;

                        cardsContainer.appendChild(cardEl);
                    });

                    container.appendChild(colEl);
                });
            }

            getColorClass(colorName) {
                const color = this.colors.find(c => c.name === colorName);
                return color ? `${color.bg} border border-white/10` : 'bg-gray-800 border-gray-700';
            }

            isCardLocked(cardId) {
                const lock = this.state.locks[cardId];
                if (!lock) return false;
                // Check expiry
                if (lock.expires < (Date.now() / 1000)) return false;
                return true;
            }

            // --- LOCKING ---

            async acquireLock(cardId) {
                if (!cardId) return true; // New card has no lock
                try {
                    const res = await fetch('api.php?action=lock', {
                        method: 'POST',
                        body: JSON.stringify({ client_uuid: this.uuid, card_id: cardId })
                    });
                    if (res.status === 423) {
                        alert("Kartu práve upravuje iný používateľ.");
                        return false;
                    }
                    return true;
                } catch (e) {
                    console.error("Lock error", e);
                    return false;
                }
            }

            async releaseLock(cardId) {
                if (!cardId) return;
                try {
                    await fetch('api.php?action=lock', {
                        method: 'POST',
                        body: JSON.stringify({ client_uuid: this.uuid, card_id: cardId, release: true })
                    });
                } catch (e) { console.error(e); }
            }

            startHeartbeat(cardId) {
                if (this.heartbeatInterval) clearInterval(this.heartbeatInterval);
                this.heartbeatInterval = setInterval(() => {
                    this.acquireLock(cardId);
                }, 30000); // 30s heartbeat
            }

            stopHeartbeat() {
                if (this.heartbeatInterval) clearInterval(this.heartbeatInterval);
                this.heartbeatInterval = null;
            }

            // --- ACTIONS ---

            async saveState(newData) {
                this.updateStatus('saving', 'Saving...');
                try {
                    const res = await fetch('api.php?action=save', {
                        method: 'POST',
                        body: JSON.stringify({
                            client_uuid: this.uuid,
                            expected_version: this.state.version, // OPTIMISTIC LOCKING
                            payload: newData
                        })
                    });

                    if (res.status === 409) {
                        const err = await res.json();
                        if (confirm(`KONFLIKT: ${err.message}\n\nChcete načítať novú verziu zo servera? (Vaše lokálne zmeny budú stratené)`)) {
                            // Force reload
                            this.lastEtag = null;
                            await this.poll();
                        }
                        return false;
                    }

                    if (res.status === 200) {
                        const updatedData = await res.json();
                        this.state = updatedData;
                        this.lastEtag = res.headers.get('ETag');
                        this.renderBoard();
                        this.updateStatus('online', 'Saved');
                        return true;
                    }
                } catch (e) {
                    alert("Chyba pri ukladaní! Skontrolujte pripojenie.");
                    this.updateStatus('offline', 'Save failed');
                    return false;
                }
            }

            // --- DRAG & DROP ---

            handleDragStart(e, cardId, srcCol) {
                e.dataTransfer.setData('text/plain', JSON.stringify({ cardId, srcCol }));
                e.dataTransfer.effectAllowed = 'move';
                e.target.classList.add('card-drag');
            }

            handleDragOver(e) {
                e.preventDefault(); // Necessary to allow dropping
                e.dataTransfer.dropEffect = 'move';
                const container = e.currentTarget;
                container.classList.add('bg-gray-800/50');
            }

            handleDragLeave(e) {
                e.currentTarget.classList.remove('bg-gray-800/50');
            }

            async handleDrop(e) {
                e.preventDefault();
                e.currentTarget.classList.remove('bg-gray-800/50');

                const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                const destColId = e.currentTarget.dataset.col;

                if (data.srcCol === destColId) return;

                // Optimistic UI update locally first? Or wait for server?
                // For reliability with locking, let's modify state and try to save.

                const newState = JSON.parse(JSON.stringify(this.state)); // Deep copy
                const cardIndex = newState.columns[data.srcCol].cards.findIndex(c => c.id === data.cardId);
                if (cardIndex === -1) return;

                const [card] = newState.columns[data.srcCol].cards.splice(cardIndex, 1);
                newState.columns[destColId].cards.push(card);

                // Lock check logic is implicit in UI (undraggable if locked), but backend will check version
                await this.saveState(newState);
            }

            // --- MODAL & CARDS ---

            async openModal(card, colId) {
                if (!await this.acquireLock(card.id)) return;
                this.startHeartbeat(card.id);

                this.isEditing = true;
                this.currentCard = card;
                this.currentCol = colId;

                document.getElementById('modal-card-id').value = card.id;
                document.getElementById('modal-title').value = card.title;
                document.getElementById('modal-desc').value = card.description || '';

                // Color picker render
                const cp = document.getElementById('modal-color-picker');
                cp.innerHTML = this.colors.map(c => `
                    <button onclick="app.selectColor('${c.name}')" 
                        class="w-8 h-8 rounded-full ${c.bg} border-2 ${card.color === c.name ? 'border-white scale-110' : 'border-transparent opacity-50 hover:opacity-100'} transition-all">
                    </button>
                `).join('');
                this.selectedColor = card.color || 'gray';

                document.getElementById('edit-modal').classList.replace('hidden', 'flex');
            }

            selectColor(name) {
                this.selectedColor = name;
                // Re-render color picker to show selection
                const cp = document.getElementById('modal-color-picker');
                Array.from(cp.children).forEach((btn, idx) => {
                    const c = this.colors[idx];
                    btn.className = `w-8 h-8 rounded-full ${c.bg} border-2 ${this.selectedColor === c.name ? 'border-white scale-110' : 'border-transparent opacity-50 hover:opacity-100'} transition-all`;
                });
            }

            closeModal() {
                this.stopHeartbeat();
                this.releaseLock(this.currentCard?.id);
                this.isEditing = false;
                this.currentCard = null;
                document.getElementById('edit-modal').classList.replace('flex', 'hidden');
                this.renderBoard(); // Re-render to remove potential visual hold
            }

            async createNewCard(colId = 'todo') {
                const title = prompt("Názov karty:");
                if (!title) return;

                const newCard = {
                    id: this.getOrInitUUID() + '_' + Date.now(),
                    title: title,
                    description: '',
                    color: 'gray'
                };

                const newState = JSON.parse(JSON.stringify(this.state));
                newState.columns[colId].cards.push(newCard);
                await this.saveState(newState);
            }

            async saveCard() {
                if (!this.currentCard) return;

                const newState = JSON.parse(JSON.stringify(this.state));
                const col = newState.columns[this.currentCol];
                const cardIdx = col.cards.findIndex(c => c.id === this.currentCard.id);

                if (cardIdx !== -1) {
                    col.cards[cardIdx].title = document.getElementById('modal-title').value;
                    col.cards[cardIdx].description = document.getElementById('modal-desc').value;
                    col.cards[cardIdx].color = this.selectedColor;

                    if (await this.saveState(newState)) {
                        this.closeModal();
                    }
                }
            }

            async deleteCard() {
                if (!confirm("Naozaj odstrániť kartu?")) return;

                const newState = JSON.parse(JSON.stringify(this.state));
                const col = newState.columns[this.currentCol];
                newState.columns[this.currentCol].cards = col.cards.filter(c => c.id !== this.currentCard.id);

                if (await this.saveState(newState)) {
                    this.closeModal();
                }
            }

            // --- UTILS ---

            updateStatus(state, text) {
                const ind = document.getElementById('status-indicator');
                const txt = document.getElementById('status-text');
                txt.textContent = text;

                if (state === 'online') {
                    ind.innerHTML = '<span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>';
                } else if (state === 'saving') {
                    ind.innerHTML = '<span class="animate-spin h-3 w-3 border-2 border-yellow-500 rounded-full border-t-transparent"></span>';
                } else if (state === 'paused') {
                    ind.innerHTML = '<span class="relative inline-flex rounded-full h-3 w-3 bg-gray-500"></span>';
                } else { // offline/error
                    ind.innerHTML = '<span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>';
                }
            }
        }

        const app = new KanbanApp();
    </script>
</body>

</html>
